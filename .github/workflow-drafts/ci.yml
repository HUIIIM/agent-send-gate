# DRAFT, NOT ENABLED. GitHub only runs files under .github/workflows/.
# This file lives in .github/workflow-drafts/ on purpose; see README.md here
# for the open permission gap and the enabling steps.
#
# Closes SEC-A5 (CI half: actions pinned to full commit SHA, dev dependencies
# installed from a hash-locked file) and VER-1 (tests, lint, format and type
# checks are blocking, not advisory). Clause IDs: HUIIIM/.github standards/SOTA.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # README promises Python 3.10+; the matrix is the evidence.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Hash-checked install of the pinned dev tools only. The project itself
      # is not installed: tests import `gate` from the checkout, and the
      # runtime has no dependencies.
      - name: Install dev tools (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q
