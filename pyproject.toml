[project]
name = "agent-send-gate"
version = "0.2.0"
description = "A send-gate for agent-originated outbound messages"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # runtime is standard library only

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.16.9",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["gate"]
